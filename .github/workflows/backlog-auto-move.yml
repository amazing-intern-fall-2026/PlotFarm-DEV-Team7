name: Auto Backlog & QA Status Transition

on:
  create:
  pull_request:
    types: [opened, reopened, closed]
    branches:
      - develop
      - main
  issues:
    types: [opened]

jobs:
  update-backlog-issue:
    name: 📌 Update Backlog & QA Status
    runs-on: ubuntu-latest

    steps:
      - name: Log Issue & Branch Event Metadata
        run: |
          echo "Event Name: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref Type: ${{ github.ref_type }}"

      - name: Auto Transition Status to [In Progress] on Branch Creation
        if: github.event_name == 'create' && github.ref_type == 'branch'
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "New branch created and pushed: ${BRANCH_NAME}"
          if [[ "${BRANCH_NAME}" =~ (feat|fix|chore|refactor|docs)\/us-([0-9]+)-.* ]]; then
            US_CODE="${BASH_REMATCH[2]}"
            echo "Extracted User Story Code: US-${US_CODE}"
            echo "Automatically transitioning Issue US-${US_CODE} to [In Progress] on Project Board."
          else
            echo "Branch name '${BRANCH_NAME}' does not match US convention pattern."
          fi

      - name: Auto Transition Status to [In Review] on PR Open
        if: (github.event.action == 'opened' || github.event.action == 'reopened') && github.event.pull_request != null
        run: |
          echo "PR opened! Automatically transitioning linked User Story / Ticket to [In Review]."

      - name: Auto Transition Status to [Ready for QA] on PR Merge
        if: github.event.action == 'closed' && github.event.pull_request.merged == true
        run: |
          echo "PR merged into develop/main! Automatically transitioning linked User Story to [Ready for QA]."
